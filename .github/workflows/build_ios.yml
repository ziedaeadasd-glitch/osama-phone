name: Build and Release iOS IPA (Osama Phone)

on:
  workflow_dispatch: # تشغيل يدوي بنقرة زر
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14 # سيرفر أبل ماك سحابي من GitHub

    steps:
      - name: 📥 استنساخ كود المشروع
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة فلاتر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: 📦 تنزيل حزم ومكتبات المشروع
        run: flutter pub get

      - name: 🔨 بناء تطبيق iOS
        run: |
          flutter build ios --release --no-codesign

      - name: 📦 تجميع وحزم ملف الـ IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r osama_phone.ipa Payload

      - name: 🚀 رفع ملف الـ IPA كـ Artifact في تبويب Actions
        uses: actions/upload-artifact@v4
        with:
          name: Osama_Phone_IPA
          path: osama_phone.ipa

      - name: 🌐 إنشاء إصدار Release وتوفير رابط تحميل مباشر
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          tag_name: v1.0.0
          name: Osama Phone iOS App v1.0.0
          body: |
            📱 **تطبيق أسامة فون لنظام iOS (iPhone)**
            - تم البناء بنجاح عبر GitHub Actions.
            - يمكنك تحميل ملف `osama_phone.ipa` وتثبيته عبر Sideloadly أو AltStore أو TrollStore.
          files: |
            osama_phone.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
