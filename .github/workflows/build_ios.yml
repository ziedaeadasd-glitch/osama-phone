name: Build and Release iOS IPA (Osama Phone)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: 📥 استنساخ كود المشروع
        uses: actions/checkout@v4

      - name: ☕ تثبيت فلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 تنزيل حزم فلاتر وتجهيز CocoaPods
        run: |
          flutter pub get
          cd ios
          pod install --repo-update || true
          cd ..

      - name: 🔨 تجميع وبناء ملف تطبيق iOS
        run: |
          flutter build ios --release --no-codesign

      - name: 📦 إنشاء وتجهيز ملف الـ IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r osama_phone.ipa Payload

      - name: 🚀 رفع ملف الـ IPA كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Osama_Phone_iOS_IPA
          path: osama_phone.ipa
          retention-days: 30

      - name: 🌐 إنشاء إصدار Release وتوفير رابط تحميل مباشر
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Osama Phone iOS v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          body: |
            📱 **تطبيق أسامة فون لنظام iOS (iPhone)**
            - تم البناء والتحزيم بنجاح.
            - يمكنك تحميل ملف `osama_phone.ipa` وتثبيته على جهازك عبر Sideloadly أو AltStore أو TrollStore.
          files: |
            osama_phone.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
